<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FAF5EA" />
    <meta name="description" content="Manager26 (HM26), kurgusal Türkiye futbolunda kulübünü yönettiğin çevrimdışı oynanabilen Türk futbol menajerlik oyunudur." />
    <meta name="author" content="HM26" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="HM26" />
    <meta name="msapplication-TileColor" content="#FAF5EA" />

    <script>
      (() => {
        try {
          const saved = localStorage.getItem('manager26-theme') || 'light';
          const dark = saved === 'dark' || (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('m26-dark', dark);
          document.documentElement.classList.toggle('m26-light', !dark);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          const themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.content = dark ? '#091521' : '#FAF5EA';
        } catch { /* first paint remains the accessible paper theme */ }
      })();
    </script>

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
