# Temporary read-only diagnostic for the first failed CI artifact.
name: Diagnose prior QA run
on:
  pull_request:
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read previous test report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/HBK-1903/hm26/actions/artifacts/13018528143/zip > "$RUNNER_TEMP/previous-qa.zip"
          mkdir -p "$RUNNER_TEMP/previous-qa"
          unzip -q "$RUNNER_TEMP/previous-qa.zip" -d "$RUNNER_TEMP/previous-qa"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          reports = list(Path(os.environ['RUNNER_TEMP'], 'previous-qa').rglob('QA-AUTOMATION-LATEST.md'))
          if not reports:
              raise SystemExit('Previous QA report is missing from the artifact')
          report = reports[0].read_text()
          failed = re.findall(r'^\|\s*(\d+)\s*\|\s*(.*?)\s*\|\s*❌ FAIL\s*\|', report, re.M)
          print(f'Found {len(failed)} failing stages in previous report')
          for number, name in failed:
              section = re.search(rf'^## {number}\. [^\n]+\n(.*?)(?=^## \d+\. |\Z)', report, re.M | re.S)
              details = section.group(1)[-4200:] if section else 'No details in report'
              message = f'{number}. {name}\n{details}'
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::warning title=Previous QA failure::{escaped}')
          PY
