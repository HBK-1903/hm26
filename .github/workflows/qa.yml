name: Build and QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# PR code runs without repository write access, deployment credentials or secrets.
permissions:
  contents: read

concurrency:
  group: hm26-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility-build:
    name: Node 18 compatibility build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 18
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run build

  full-qa:
    name: Node 22, simulations and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      HM26_SCREENSHOTS: ${{ github.workspace }}/_shots/e2e
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare fresh diagnostic directories
        run: |
          rm -f QA-AUTOMATION-LATEST.md
          mkdir -p "$RUNNER_TEMP/hm26" "$HM26_SCREENSHOTS"
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$RUNNER_TEMP/hm26/install.log"
      - name: Install Chromium and system libraries
        shell: bash
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tee "$RUNNER_TEMP/hm26/chromium.log"
      - name: Run complete build, simulation and browser regressions
        shell: bash
        run: |
          set -o pipefail
          npm run qa:all 2>&1 | tee "$RUNNER_TEMP/hm26/qa.log"
      - name: Upload report, log and browser screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hm26-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            QA-AUTOMATION-LATEST.md
            ${{ runner.temp }}/hm26/*.log
            _shots/
          if-no-files-found: warn
          retention-days: 14
