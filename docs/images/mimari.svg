<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="1400" height="400" role="img" aria-labelledby="title desc">
  <title id="title">HM26 teknik mimari özeti</title>
  <desc id="desc">React arayüzü oyun durumuyla, oyun durumu IndexedDB ve simülasyon motoruyla çalışır. Phaser canlı sahayı çizer; servis çalışanı üretimde uygulama kaynaklarını önbellekler.</desc>
  <rect width="1400" height="400" rx="24" fill="#f7f2e7"/>
